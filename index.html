<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumber — build it from the stock you buy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Lumber<span>.</span></h1>
        <button id="projName" class="proj" title="Rename this project"></button>
        <div class="group">
          <button id="bNew" class="icon" title="New project"></button>
          <button id="bOpen" class="icon" title="Projects (Ctrl+O)"></button>
          <button id="bSave" class="icon" title="Export as JSON (Ctrl+S)"></button>
        </div>
        <div class="group">
          <button id="bUndo" class="icon" title="Undo (Ctrl+Z)"></button>
          <button id="bRedo" class="icon" title="Redo (Ctrl+Shift+Z)"></button>
        </div>
        <div class="group">
          <label class="field" for="gridSel"
            ><span class="small">Grid</span>
            <select id="gridSel">
              <option value="0">off</option>
              <option value="0.0625">1/16"</option>
              <option value="0.125">1/8"</option>
              <option value="0.25">1/4"</option>
              <option value="0.5" selected>1/2"</option>
              <option value="1">1"</option>
              <option value="12">12"</option>
            </select>
          </label>
          <label class="switch" for="snapChk" title="Snap to other parts' faces and the floor">
            <input id="snapChk" type="checkbox" checked />
            <span class="small">Snap</span>
          </label>
          <label
            class="switch"
            for="trackChk"
            title="Trackpad: two-finger drag orbits, pinch zooms, Shift+two-finger pans. Alt+drag orbits either way."
          >
            <input id="trackChk" type="checkbox" />
            <span class="small">Trackpad</span>
          </label>
        </div>
        <span class="spacer"></span>
        <div class="group">
          <button id="bSample" title="Load the sample workbench">Sample</button>
          <button id="bCsv" class="icon" title="Download the cut list as CSV"></button>
          <button id="bPrint" class="icon" title="Print the cut list and buy list"></button>
          <button
            id="bDrawings"
            class="icon"
            title="Shop drawings: views of the model and a sheet per part"
          ></button>
          <button id="bShare" class="icon" title="Copy a link that carries this project"></button>
        </div>
        <div class="group">
          <button id="bTheme" class="icon" title="Light or dark theme"></button>
          <button id="bPalette" class="icon" title="Stock palette (T)"></button>
          <button id="bSide" class="icon" title="Side panel (N)"></button>
        </div>
      </header>

      <nav id="toolbar" aria-label="Tools"></nav>

      <aside id="palette">
        <div class="pal-head">
          <h2>Stock</h2>
          <input id="palSearch" type="search" placeholder="Search" aria-label="Search stock" />
          <button id="bStockEdit" class="icon ghost" title="Edit the stock table"></button>
        </div>
        <div class="pal-body">
          <h3 hidden>Recent</h3>
          <div id="recent" hidden></div>
          <h3>Boards</h3>
          <div id="boards"></div>
          <h3>Sheets</h3>
          <div id="sheets"></div>
          <h3 title="Stand-ins to design around; never cut or bought">Reference</h3>
          <div id="reference"></div>
          <p class="hint">
            Drag onto the scene, or click to add at the center. Shift+A adds at the pointer.
          </p>
        </div>
      </aside>

      <main id="viewport"></main>

      <aside id="side">
        <div class="tabs" role="tablist">
          <button data-tab="parts" class="on" role="tab">
            Parts <span id="outCount" class="count"></span>
          </button>
          <button data-tab="cut" role="tab">Cut list</button>
        </div>
        <div id="tab-parts" class="pane">
          <div class="pane-head">
            <input
              id="outFilter"
              type="search"
              placeholder="Filter parts"
              aria-label="Filter parts"
            />
          </div>
          <div id="outBody" class="pane-body"></div>
        </div>
        <div id="tab-cut" class="pane" hidden>
          <div id="cutBody" class="pane-body"></div>
        </div>
        <div id="props"></div>
      </aside>

      <footer>
        <span id="stat">0 parts</span>
        <span id="hints" class="hints"></span>
        <span class="spacer"></span>
        <span>Overall <b id="overall">—</b></span>
        <span id="saved" class="muted saved">Saved</span>
      </footer>

      <div id="help" class="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
